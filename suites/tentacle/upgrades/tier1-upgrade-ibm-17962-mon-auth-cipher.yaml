#################################################################################
# IBMCEPH-17962: monitor auth cipher policy preserved across cephadm upgrade
#
#--------------------------------------------------------------------------------
# Cluster Configuration: conf/tentacle/upgrades/1admin-3node-1client-upgrade.yaml
#--------------------------------------------------------------------------------
#
# Test Steps:
#--------------------------------------------------------------------------------
# - Deploy IBMSC 9.1 released cluster
# - Capture mon auth_allowed_ciphers baseline before upgrade
# - Upgrade cluster to latest IBMSC 9.x (BUILD_VERSION/RELEASE from executor)
# - Validate auth cipher policy unchanged and legacy aes was not introduced
#--------------------------------------------------------------------------------
#################################################################################
tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy the required pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true
  - test:
      abort-on-fail: true
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                rhcs-version: 9.1
                release: "released"
                mon-ip: node1
                orphan-initial-daemons: true
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
      desc: Bootstrap minimal cluster for mon auth cipher upgrade validation.
      destroy-cluster: false
      module: test_cephadm.py
      name: Deploy IBMSC cluster using cephadm
  - test:
      name: Capture monitor auth cipher baseline before upgrade
      desc: Save mon auth_allowed_ciphers policy before upgrade (IBMCEPH-17962)
      module: test_mon_auth_cipher_post_upgrade.py
      abort-on-fail: true
      config:
        phase: capture
  - test:
      name: Upgrade cluster to latest 9.x ceph version
      desc: Upgrade cluster to latest version
      module: test_cephadm_upgrade.py
      config:
        command: start
        service: upgrade
        base_cmd_args:
          verbose: true
        verify_cluster_health: true
      destroy-cluster: false
      abort-on-fail: true
  - test:
      name: Validate monitor auth cipher policy after upgrade
      desc: Ensure upgrade did not add legacy aes cipher (IBMCEPH-17962)
      module: test_mon_auth_cipher_post_upgrade.py
      abort-on-fail: true
      config:
        phase: validate

# ===============================================================================
# DEBUG-ONLY (branch debug/nfs-byok-ibmcloud-hold) — do not merge to main.
# IBM Cloud BYOK debug suite: infra + first BYOK test (CEPH-83625072). No hold sleep.
# Configuration: conf/tentacle/nfs/1admin-7node-3client.yaml
#
# Prerequisites:
#   • GKLM credentials via --custom-config-file / --custom-config / ~/.cephci.yaml
#     (ibmc gklm_config for IBM Cloud)
# ===============================================================================
---
tests:
     - test:
         abort-on-fail: true
         desc: Install software pre-requisites for cluster deployment.
         module: install_prereq.py
         name: setup pre-requisites

     - test:
         abort-on-fail: true
         config:
           steps:
             - config:
                 command: bootstrap
                 service: cephadm
                 args:
                   mon-ip: node1
             - config:
                 command: add_hosts
                 service: host
                 args:
                   attach_ip_address: true
                   labels: apply-all-labels
             - config:
                 command: apply
                 service: osd
                 args:
                   all-available-devices: true
             - config:
                 command: apply
                 service: rgw
                 pos_args:
                   - rgw.1
                 args:
                   placement:
                     label: rgw
             - config:
                 args:
                   - "ceph fs volume create cephfs"
                 command: shell
             - config:
                 args:
                   placement:
                     label: mds
                 base_cmd_args:
                   verbose: true
                 command: apply
                 pos_args:
                   - cephfs
                 service: mds
             - config:
                 args:
                   - "ceph osd pool create rbd"
                 command: shell
             - config:
                 args:
                   - "rbd pool init rbd"
                 command: shell
         desc: bootstrap and deploy services.
         destroy-cluster: false
         polarion-id: CEPH-83573713
         module: test_cephadm.py
         name: Deploy cluster using cephadm

     - test:
         abort-on-fail: true
         config:
           command: add
           id: client.1
           node: node4
           install_packages:
             - ceph-common
             - ceph-fuse
           copy_admin_keyring: true
         desc: Configure the RGW,RBD client system
         destroy-cluster: false
         module: test_client.py
         name: configure client

     - test:
         abort-on-fail: true
         config:
           command: add
           id: client.2
           node: node5
           install_packages:
             - ceph-common
             - ceph-fuse
           copy_admin_keyring: true
         desc: Configure the RGW,RBD client system
         destroy-cluster: false
         module: test_client.py
         name: configure client

     - test:
         abort-on-fail: true
         config:
           command: add
           id: client.3
           node: node6
           install_packages:
             - ceph-common
             - ceph-fuse
           copy_admin_keyring: true
         desc: Configure the RGW,RBD client system
         destroy-cluster: false
         module: test_client.py
         name: configure client

     - test:
         abort-on-fail: true
         config:
           command: add
           id: client.4
           node: node7
           install_packages:
             - ceph-common
             - ceph-fuse
           copy_admin_keyring: true
         desc: Configure the RGW,RBD client system
         destroy-cluster: false
         module: test_client.py
         name: configure client

     - test:
         name: Test Encryption with the correct keys (single cluster)
         module: byok.test_byok_single_multi_restart.py
         desc: BYOK single-cluster with FUSE encryption validation
         polarion-id: CEPH-83625072
         abort-on-fail: false
         config:
            nfs_version: 4.2
            total_export_num: 4
            clients: 1
            nfs_replication_number: 1           # Single cluster mode
            nfs_mount: /mnt/nfs_byok
            nfs_export: /export_byok
            nfs_instance_name: nfs_byok

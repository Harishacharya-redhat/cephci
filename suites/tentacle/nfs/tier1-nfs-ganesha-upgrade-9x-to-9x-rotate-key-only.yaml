##############################################################################################
# Temporary trimmed suite: bootstrap 9.1(z1) -> upgrade to RC -> NFS CephX rotate-key
# Use for validating test_nfs_cephx_key_rotation post-upgrade without full tier1 noise.
#
# Conf: conf/tentacle/nfs/1admin-7node-3client.yaml
##############################################################################################
tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Bootstrap Ceph 9.1(z1) cluster with label placements
      desc: Bootstrap Ceph 9.1(z1) cluster with label placements
      polarion-id: CEPH-83573777
      module: test_cephadm.py
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                rhcs-version: 9.1
                release: z1
                mon-ip: node1
                orphan-initial-daemons: true
                skip-monitoring-stack: false
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
          - config:
              args:
                - "ceph osd pool create rbd"
              command: shell
          - config:
              args:
                - "rbd pool init rbd"
              command: shell
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Configure client1
      desc: Configure the RGW,RBD client system
      module: test_client.py
      polarion-id: CEPH-83573777
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Upgrade cluster to latest Ceph 9.x
      desc: Upgrade cluster to latest Ceph 9.x
      module: test_cephadm_upgrade.py
      polarion-id: CEPH-83573791,CEPH-83573790
      abort-on-fail: true
      config:
        command: start
        service: upgrade
        base_cmd_args:
          verbose: true

  - test:
      name: NFS CephX key rotation ceph nfs cluster rotate key
      module: test_nfs_cephx_key_rotation.py
      desc: NFS export stays mounted post nfs cluster key rotate
      polarion-id: CEPH-83632951
      abort-on-fail: false
      config:
        nfs_version: 4.1
        clients: 1
        nfs_name: cephfs-nfs-cephx

##############################################################################################
# Tier-Level: 1 (trimmed)
# Test-Suite: tier1-nfs-ganesha-upgrade-9x-to-9x-latest.yaml
# Scenario: Bootstrap 9.1(z1), configure clients, upgrade to 9.x (--build z2) with NFS IO
#
# Cluster Configuration: conf/tentacle/nfs/1admin-7node-3client.yaml
##############################################################################################
tests:
  - test:
      name: setup install pre-requisistes
      desc: Setup phase to deploy pre-requisites for running the tests.
      module: install_prereq.py
      abort-on-fail: true

  - test:
      name: Bootstrap Ceph 9.1(z1) cluster with label placements
      desc: Bootstrap Ceph 9.1(z1) cluster with label placements
      polarion-id: CEPH-83573777
      module: test_cephadm.py
      config:
        verify_cluster_health: true
        steps:
          - config:
              command: bootstrap
              service: cephadm
              args:
                rhcs-version: 9.1
                release: z1
                mon-ip: node1
                orphan-initial-daemons: true
                skip-monitoring-stack: false
          - config:
              command: add_hosts
              service: host
              args:
                attach_ip_address: true
                labels: apply-all-labels
          - config:
              command: apply
              service: mgr
              args:
                placement:
                  label: mgr
          - config:
              command: apply
              service: mon
              args:
                placement:
                  label: mon
          - config:
              command: apply
              service: osd
              args:
                all-available-devices: true
          - config:
              command: apply
              service: rgw
              pos_args:
                - rgw.1
              args:
                placement:
                  label: rgw
          - config:
              args:
                - "ceph fs volume create cephfs"
              command: shell
          - config:
              args:
                placement:
                  label: mds
              base_cmd_args:
                verbose: true
              command: apply
              pos_args:
                - cephfs
              service: mds
          - config:
              args:
                - "ceph osd pool create rbd"
              command: shell
          - config:
              args:
                - "rbd pool init rbd"
              command: shell
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Configure client1
      desc: Configure the RGW,RBD client system
      module: test_client.py
      polarion-id: CEPH-83573777
      config:
        command: add
        id: client.1
        node: node4
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Configure client2
      desc: Configure the RGW,RBD client system
      module: test_client.py
      polarion-id: CEPH-83573777
      config:
        command: add
        id: client.2
        node: node5
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Configure client3
      desc: Configure the RGW,RBD client system
      module: test_client.py
      polarion-id: CEPH-83573777
      config:
        command: add
        id: client.3
        node: node6
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Configure client4
      desc: Configure the RGW,RBD client system
      module: test_client.py
      polarion-id: CEPH-83573777
      config:
        command: add
        id: client.4
        node: node7
        install_packages:
          - ceph-common
          - ceph-fuse
        copy_admin_keyring: true
      destroy-cluster: false
      abort-on-fail: true

  - test:
      name: Enable logging to file
      module: rados_prep.py
      config:
        log_to_file: true
        mds_debug_mds: 20
      desc: Change config options to enable logging to file and mds debug_mds

  - test:
      name: Setup NFS-Ganesha cluster
      desc: Setup NFS-Ganesha cluster
      module: nfs_verify_multiple_parallel_io_and_lookups.py
      polarion-id: CEPH-83581304
      abort-on-fail: false
      config:
        sudo: false
        nfs_version: 4.1
        clients: 4
        io: false
        cleanup: false

  - test:
      name: Upgrade along with IOs for nfs
      module: test_parallel.py
      desc: Upgrade along with IOs for nfs in parallel
      parallel:
        - test:
            name: Upgrade cluster to latest Ceph 9.x
            desc: Upgrade cluster to latest Ceph 9.x (target build from --build z2)
            module: test_cephadm_upgrade.py
            polarion-id: CEPH-83573791,CEPH-83573790
            config:
              command: start
              service: upgrade
              base_cmd_args:
                verbose: true

        - test:
            name: nfs operations during upgrade
            module: test_nfs_io_operations_during_upgrade.py
            desc: NFS ops during upgrade - create, delete, write, read, rename
            polarion-id: CEPH-83620035
            abort-on-fail: false
            config:
              sudo: false
              nfs_version: 4.2
              clients: 4
              setup: false
              file_count: 25
              dd_command_size_in_M: 10
              exports_number: 4
              loop_count: 4
      abort-on-fail: false
